global:
  nodeSelector:
    role: system
  tolerations:
    - key: dedicated
      operator: Equal
      value: system_pods
      effect: NoSchedule

############################################################################################################


configs:
  params:
    # Tells Argo CD to disable internal SSL so the AWS ALB can handle it cleanly
    server.insecure: "true"
  cm:
    # LUA HEALTH CHECK Enables custom health tracking for child Applications so Sync Waves wait for pod readiness
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  ingress:
    enabled: false
    ingressClassName: "alb"
    annotations:
      # Provisions a public, internet-facing load balancer
      alb.ingress.kubernetes.io/scheme: internet-facing
      # Directs traffic straight to pod IPs (Best practice for EKS VPC CNI)
      alb.ingress.kubernetes.io/target-type: ip
      # Essential: Maps the correct path for Argo CD's health check endpoint
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      # Configure listening ports (Uncomment certificate-arn when you add your ACM SSL)
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:REGION:ACCOUNT:certificate/YOUR-CERT-ID"
      # alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    hosts: []
      # raw alb address will be used for now, but you can add your own domain here if you want to use a custom domain name
      #- "*"

    paths:
      - /
    pathType: Prefix
