name: Terraform Dev delete eks cluster

on:
    workflow_dispatch:
   
env:
  name: dev
  TF_VERSION: latest
  TF_WORKING_DIR_1 : environments/dev/eks
  AWS_REGION: us-east-1

jobs:

  terraform_destroy:
    name: Terraform Dev destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
       
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform init

      - name: Terraform destroy
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform destroy -auto-approve