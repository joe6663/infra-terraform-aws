name: Terraform Dev

on:

  push:

    branches:
      - feature/karpenter
    paths:
      - environments/dev/**
      - modules/**
      - .github/workflows/terraform-dev.yaml

  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
    paths:
      - environments/dev/**
      - modules/**
      - .github/workflows/terraform-dev.yaml

env:
  name: dev
  TF_VERSION: latest
  TF_WORKING_DIR_1 : environments/dev/eks
  TF_WORKING_DIR_2 : environments/dev/eks-addons
  AWS_REGION: us-east-1

jobs:

######### -------------- VALIDATE TERRAFORM CONFIGS -------------- #########

  terraform_validate:
    name: Terraform Dev validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

# --- EKS Cluster ---

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform fmt -check -recursive 

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform validate

# --- EKS Addons ---
    
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR_2 }}
        run: terraform fmt -check -recursive 

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR_2 }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR_2 }}
        run: terraform validate

######### -------------- SECURITY SCAN TERRAFORM -------------- #########

  terraform_security_scan:
    name: Terraform Dev security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: install checkov
        run: pip install checkov

# --- EKS Cluster ---

      - name: Terraform security scan
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: checkov -d . --framework terraform --quiet

# --- EKS Addons ---

      - name: Terraform security scan
        working-directory: ${{ env.TF_WORKING_DIR_2 }}
        run: checkov -d . --framework terraform --quiet


######### -------------- SECURITY SCAN TERRAFORM -------------- #########

  terraform_plan:
    name: Terraform Dev plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR_1 }}
        run: terraform plan -out=tfplan